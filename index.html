<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kemono PWA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Kemono PWA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Kemono Viewer</h1>
        <p>Ứng dụng PWA nhẹ, tối ưu cho iPhone.</p>
      </header>

      <form id="search-form" class="controls">
        <label>
          Dịch vụ
          <select id="service" name="service">
            <option value="patreon">patreon</option>
            <option value="fanbox">fanbox</option>
            <option value="gumroad">gumroad</option>
            <option value="subscribestar">subscribestar</option>
            <option value="fantia">fantia</option>
            <option value="onlyfans">onlyfans</option>
          </select>
        </label>
        <label>
          Creator ID
          <input id="creator-id" name="creatorId" required placeholder="Nhập ID creator" />
        </label>
        <button type="submit">Tải bài viết</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <section id="posts" class="posts"></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
